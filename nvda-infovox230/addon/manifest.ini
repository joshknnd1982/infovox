# NVDA add-on manifest for the Infovox 230 synth driver.
name = infovox230
summary = "Infovox 230 (Telia Promotor) speech synthesizer"
description = """Brings the classic Infovox 230 SAPI4 text-to-speech engine to
NVDA 2026.1 (64-bit). A bundled 32-bit host process hosts the engine and streams
audio to NVDA. All voices, languages and the rate/pitch/volume parameters the
engine supports are exposed. The engine is public domain; the hardware-dongle
licence check is satisfied by an included emulator."""
author = "Josh Kennedy <joshknnd1982@gmail.com>"
version = 0.3
# NVDA compatibility: 2026.1 introduced the 64-bit build. Keep in sync with the
# NVDA you install into (Help > About shows the version).
minimumNVDAVersion = 2026.1
lastTestedNVDAVersion = 2026.1
updateChannel = None
url = https://github.com/joshknnd1982/infovox
